<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InvenTree Companion</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#141413">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Companion">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="icon" href="/static/icons/icon-192.png">
<script>
  // Apply theme before first paint to avoid a flash.
  (function () {
    var t = 'system';
    try { t = localStorage.getItem('theme') || 'system'; } catch (e) {}
    if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Main">
    <div class="brand">
      <div class="brand-mark">iT</div>
      <div class="brand-name">InvenTree<small>Companion</small></div>
    </div>
    <div id="railLinks"></div>
    <div class="rail-foot">
      <span class="tiny faint grow ellipsis" id="serverBadge"></span>
      <button class="iconbtn" id="themeToggle" aria-label="Toggle theme"></button>
    </div>
  </nav>

  <div class="main">
    <header class="appbar" id="appbar">
      <button class="iconbtn back" id="backBtn" aria-label="Back" hidden></button>
      <h1 id="pageTitle">InvenTree Companion</h1>
      <div class="row" id="appbarActions"></div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Main"></nav>

<script type="module" src="/static/js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
